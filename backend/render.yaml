# render.yaml
services:
  - type: web
    name: kanban-estoque-api
    runtime: node
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true